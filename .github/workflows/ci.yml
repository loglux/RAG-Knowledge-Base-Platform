name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + black + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: kb_pass
          POSTGRES_DB: knowledge_base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # tests/conftest.py derives TEST_DATABASE_URL from this by swapping the
      # db name - the "knowledge_base" db itself is never connected to in
      # tests (app lifespan never runs), only "knowledge_base_test" is.
      DATABASE_URL: postgresql+asyncpg://kb_user:kb_pass@localhost:5432/knowledge_base
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Create venv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: make install-dev

      - name: Lint (ruff + black --check)
        run: make lint

      - name: Type check (mypy)
        run: make typecheck

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: make frontend-lint

      - name: Build
        run: make frontend-build
